[project]
name = "knowledge-base-api"
version = "0.1.0"
description = "AI 知识库后端（FastAPI + PostgreSQL）"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.1,<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "greenlet>=3.1.1",
    "passlib>=1.7.4",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",   # 测试用 SQLite（不依赖本机 PG）
    "httpx>=0.27.0",        # fastapi TestClient 需要
    "pytest>=8.3.0",
]

[tool.uv]
# 这是个「应用」不是「库」：只装依赖，不要把项目本身 build/安装进虚拟环境，
# 省掉 build backend，也避免 uv 去猜顶层包名（仓库里还有 frontend/ scripts/ tests/）。
package = false

[tool.pytest.ini_options]
# 原来放在 pytest.ini 里，合并到这里，根目录少一个配置文件
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
# DEVELOPMENT.md 让本地跑 ruff，这里给它对齐项目风格（行宽 120 / Py311）
line-length = 120
target-version = "py311"
exclude = ["frontend", "data", "app/.venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI 依赖注入惯用 Default 值（Depends/File/Query）当参数默认值
